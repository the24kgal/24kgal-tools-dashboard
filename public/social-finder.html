<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Finder AI</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-lg w-full">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Social Profile Finder</h1>
        
        <p class="text-center text-gray-600 mb-6">
            Enter a name or username below and click the button to find social media profiles 
        </p>

        <div class="mb-6">
            <label for="searchInput" class="block text-sm font-medium text-gray-700 mb-2">Search Query (e.g., a username)</label>
            <input type="text" id="searchInput" placeholder="e.g., janesmith" class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200">
        </div>

        <div class="flex justify-center mb-6">
            <button id="lookupButton" class="bg-indigo-600 text-white font-bold py-3 px-6 rounded-full shadow-md hover:bg-indigo-700 transition duration-300 ease-in-out transform hover:scale-105">
                Find Profiles
            </button>
        </div>

        <div id="resultContainer" class="mt-8 bg-gray-50 p-6 rounded-lg border border-gray-200 hidden">
            <!-- Results will be displayed here -->
            <p class="text-center text-gray-500">
                Data will appear here after the search.
            </p>
        </div>

        <div id="loadingIndicator" class="mt-8 text-center text-indigo-600 font-medium hidden">
            <svg class="animate-spin h-5 w-5 text-indigo-500 inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Fetching data...
        </div>

        <div id="errorContainer" class="mt-8 text-center text-red-500 font-medium hidden">
            <!-- Errors will be displayed here -->
        </div>
    </div>

    <script>
        // Get references to HTML elements
        const searchInput = document.getElementById('searchInput');
        const lookupButton = document.getElementById('lookupButton');
        const resultContainer = document.getElementById('resultContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorContainer = document.getElementById('errorContainer');

        // Function to display an error message
        function displayError(message) {
            errorContainer.textContent = `Error: ${message}`;
            errorContainer.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            loadingIndicator.classList.add('hidden');
        }

        // Function to display the lookup results
        function displayResults(data) {
            // Assuming the API returns an object with a 'profiles' array
            if (data && data.profiles && Array.isArray(data.profiles) && data.profiles.length > 0) {
                resultContainer.classList.remove('hidden');
                errorContainer.classList.add('hidden');
                loadingIndicator.classList.add('hidden');

                const profilesHtml = data.profiles.map(profile => `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                        <p><span class="font-medium text-gray-600">Platform:</span> <span class="text-gray-800">${profile.platform || 'N/A'}</span></p>
                        <p><span class="font-medium text-gray-600">Username:</span> <span class="text-gray-800">${profile.username || 'N/A'}</span></p>
                        <p><span class="font-medium text-gray-600">URL:</span> <a href="${profile.url}" target="_blank" class="text-indigo-600 hover:underline">${profile.url || 'N/A'}</a></p>
                    </div>
                `).join('');

                resultContainer.innerHTML = `
                    <h2 class="text-2xl font-semibold mb-4 text-gray-700">Profiles Found</h2>
                    <div class="space-y-3">
                        ${profilesHtml}
                    </div>
                `;
            } else {
                displayError("No profiles found or API response was not in the expected format.");
            }
        }

        // Add a click event listener to the button
        lookupButton.addEventListener('click', () => {
            const searchQuery = searchInput.value.trim();

            if (!searchQuery) {
                displayError("Please enter a name or username to search.");
                return;
            }

            // Show loading indicator and hide previous results/errors
            loadingIndicator.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');

            const xhr = new XMLHttpRequest();
            
            // Use the new API endpoint with the search query from the input field
            // The API is assumed to use a query parameter 'q'
            xhr.open('GET', `https://socialfinder-ai.p.rapidapi.com/?q=${encodeURIComponent(searchQuery)}`);
            xhr.setRequestHeader('x-rapidapi-key', '4d24805173msh8bacb8c70b79406p156f40jsn9c2371036339');
            xhr.setRequestHeader('x-rapidapi-host', 'socialfinder-ai.p.rapidapi.com');
            
            // Handle the response when the request is complete
            xhr.onload = function() {
                loadingIndicator.classList.add('hidden');
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const response = JSON.parse(xhr.responseText);
                        displayResults(response);
                    } catch (e) {
                        displayError("Failed to parse the JSON response from the API. It might be in an unexpected format.");
                    }
                } else {
                    displayError(`Request failed with status code: ${xhr.status}. Check your API key and network connection.`);
                }
            };

            // Handle network errors
            xhr.onerror = function() {
                loadingIndicator.classList.add('hidden');
                displayError("A network error occurred. Please check your internet connection.");
            };

            // Send the request without a body for this specific endpoint
            xhr.send();
        });
    </script>
</body>
</html>
